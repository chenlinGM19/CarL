plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.caroverlay'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.caroverlay"
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // Attempt to use a local debug.keystore in the app directory for consistency across environments
            def keystoreFile = file("debug.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
            // Explicitly enable V1 and V2 signing for maximum compatibility with car head units
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            // Use the debug signing config for release builds to allow overwriting existing installations
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}